<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Permanent+Marker&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Minum Air launch video: a torn-paper collage, drawn frame by frame. render(t) draws time t (s).
const W = 1080, H = 1920, FPS = 30;
const C = document.getElementById('c'); let X = C.getContext('2d');
const INK = '#141414', BLUE = '#1677e0', SKY = '#3aa8ff', PAPER = '#efe9dc', YEL = '#ffd23f', PINK = '#ff9db5';

// ---------- helpers ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (a, b) => rng((a * 73856093) ^ (b * 19349663))();
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = (k) => Math.pow(clamp(k), 2.4);
// Stop motion: paper pieces "boil" a little, 12 times a second.
function boil(t, seed, amt = 1) {
  const s = Math.floor(t * 12);
  return { dx: (hash(s, seed) - .5) * 5 * amt, dy: (hash(s, seed + 1) - .5) * 5 * amt, r: (hash(s, seed + 2) - .5) * .012 * amt };
}
// Slam in: big for a frame, squash, settle. Returns null before it lands.
function slam(t, t0) {
  if (t < t0) return null;
  const f = Math.floor((t - t0) * FPS);
  return [1.32, .92, 1.05, .99, 1][Math.min(f, 4)];
}
function img(src) { const i = new Image(); i.src = src; return i; }
const A = {
  paper: img('assets/paper.jpg'), blue: img('assets/paper-blue.jpg'), end: img('assets/paper-end.jpg'), tile: img('assets/crumple-tile.jpg'),
  sit: img('assets/meowie-sit-copy.png'), swim: img('assets/meowie-swim-copy.png'), full: img('assets/meowie-full-copy.png'), color: img('assets/meowie-sit-color.png'), icon: img('assets/icon-512.png'),
};

function vid(src) { const v = document.createElement('video'); v.src = src; v.muted = true; v.preload = 'auto'; return v; }
function seek(v, t) {
  return new Promise((res) => {
    if (Math.abs(v.currentTime - t) < 1e-3 && v.readyState >= 2) return res();
    const done = () => { v.removeEventListener('seeked', done); res(); };
    v.addEventListener('seeked', done); v.currentTime = t;
  });
}

// A torn-edged polygon around a w x h box (centred at 0,0). Cached per seed.
const polyCache = {};
function tornPoly(w, h, seed, amp = 7, step = 16) {
  const k = [w, h, seed, amp].join();
  if (polyCache[k]) return polyCache[k];
  const r = rng(seed), pts = [];
  const edge = (x0, y0, x1, y1) => {
    const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(len / step));
    const nx = -(y1 - y0) / len, ny = (x1 - x0) / len;
    let off = 0;
    for (let i = 0; i < n; i++) {
      const u = i / n; off = off * .55 + (r() - .5) * amp * 1.6;
      const j = (r() - .5) * amp * .6;
      pts.push([x0 + (x1 - x0) * u + nx * (off + j), y0 + (y1 - y0) * u + ny * (off + j)]);
    }
  };
  edge(-w / 2, -h / 2, w / 2, -h / 2); edge(w / 2, -h / 2, w / 2, h / 2); edge(w / 2, h / 2, -w / 2, h / 2); edge(-w / 2, h / 2, -w / 2, -h / 2);
  const p = new Path2D(); pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); p.closePath();
  return (polyCache[k] = p);
}
// Paper texture laid over whatever is clipped (multiply), so flat colour reads as crumpled paper.
function texture(alpha = .5, op = 'multiply') {
  X.save(); X.globalAlpha = alpha; X.globalCompositeOperation = op;
  X.drawImage(A.tile, -600, -600, 1200, 1200); X.restore();
}
// A torn paper label: white torn core showing at the edges, coloured face, crumple, text.
function label(o, t) {
  const s = slam(t, o.t0); if (s == null) return;
  const b = boil(t, o.seed, o.boil ?? 1);
  X.save();
  X.translate(o.x + b.dx, o.y + b.dy); X.rotate((o.rot || 0) * Math.PI / 180 + b.r); X.scale(s, s);
  X.font = o.font; const m = X.measureText(o.text);
  const w = o.w || m.width + (o.padX ?? 60), h = o.h || (o.size || 100) * 1.25;
  X.shadowColor = 'rgba(0,0,0,.35)'; X.shadowBlur = 22; X.shadowOffsetY = 10;
  X.fillStyle = '#f7f3ea'; X.fill(tornPoly(w + 12, h + 12, o.seed + 5, 9));
  X.shadowColor = 'transparent';
  X.save(); X.clip(tornPoly(w, h, o.seed, 7)); X.fillStyle = o.bg; X.fillRect(-w, -h, w * 2, h * 2); texture(o.bg === '#f7f3ea' ? .35 : .45); X.restore();
  X.fillStyle = o.fg; X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(o.text, 0, (o.size || 100) * .06);
  X.restore();
}
// Loose text (typewriter or marker), stop-motion boil only.
function words(o, t) {
  if (t < o.t0) return;
  const b = boil(t, o.seed, .6);
  X.save(); X.translate(o.x + b.dx, o.y + b.dy); X.rotate((o.rot || 0) * Math.PI / 180 + b.r);
  X.font = o.font; X.fillStyle = o.color || INK; X.textAlign = o.align || 'left'; X.textBaseline = 'top';
  // Typewriter: letters appear one after another.
  const lines = o.text.split('\n'); let shown = o.type ? Math.floor((t - o.t0) * o.type) : 1e9;
  lines.forEach((ln, i) => { const part = ln.slice(0, Math.max(0, shown)); shown -= ln.length; X.fillText(part, 0, i * o.lh); });
  X.restore();
}
// A cut-out image (photocopied Meowie etc) with a paper shadow.
function cutout(im, o, t) {
  const s = o.t0 == null ? 1 : slam(t, o.t0); if (s == null || !im.naturalWidth) return;
  const b = boil(t, o.seed, o.boil ?? 1);
  X.save(); X.translate(o.x + b.dx, o.y + b.dy); X.rotate((o.rot || 0) * Math.PI / 180 + b.r); X.scale(s * o.scale, s * o.scale);
  X.shadowColor = 'rgba(0,0,0,.35)'; X.shadowBlur = 24; X.shadowOffsetY = 12;
  X.drawImage(im, -im.naturalWidth / 2, -im.naturalHeight / 2);
  X.restore();
}
// Marker scribble loop drawn on over [t0, t0+dur].
function scribble(cx, cy, rx, ry, t, t0, dur, seed, color = SKY, width = 11, turns = 1.25) {
  if (t < t0) return;
  const k = ease((t - t0) / dur), r = rng(seed), n = 90, end = Math.floor(n * k);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = -Math.PI * .6 + (i / n) * Math.PI * 2 * turns;
    const w = 1 + .08 * Math.sin(i * .37 + seed) + (i / n) * .07;
    pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]);
  }
  X.save(); X.strokeStyle = color; X.lineWidth = width; X.lineCap = 'round'; X.lineJoin = 'round'; X.globalAlpha = .92;
  X.beginPath(); pts.slice(0, end + 1).forEach(([x, y], i) => (i ? X.lineTo(x, y) : X.moveTo(x, y))); X.stroke();
  X.globalAlpha = .35; X.lineWidth = width * .45; X.beginPath(); pts.slice(0, end + 1).forEach(([x, y], i) => (i ? X.lineTo(x + 3, y - 2) : X.moveTo(x + 3, y - 2))); X.stroke();
  X.restore();
}
function arrow(x0, y0, x1, y1, t, t0, color = SKY) {
  if (t < t0) return;
  const k = ease((t - t0) / .25), mx = (x0 + x1) / 2 + 40, my = (y0 + y1) / 2 - 50;
  X.save(); X.strokeStyle = color; X.lineWidth = 10; X.lineCap = 'round'; X.lineJoin = 'round';
  X.beginPath(); X.moveTo(x0, y0);
  const ex = x0 + (x1 - x0) * k, ey = y0 + (y1 - y0) * k;
  X.quadraticCurveTo(x0 + (mx - x0) * k, y0 + (my - y0) * k, ex, ey); X.stroke();
  if (k > .95) { const a = Math.atan2(y1 - my, x1 - mx); X.beginPath(); X.moveTo(x1 - Math.cos(a - .5) * 34, y1 - Math.sin(a - .5) * 34); X.lineTo(x1, y1); X.lineTo(x1 - Math.cos(a + .5) * 34, y1 - Math.sin(a + .5) * 34); X.stroke(); }
  X.restore();
}
// Thin hand-ruled grid lines and soft window-blind shadows (the room light on the desk).
function grid(t, seed, color = 'rgba(20,20,20,.55)') {
  const r = rng(seed), b = boil(t, seed, .4);
  X.save(); X.strokeStyle = color; X.lineWidth = 2.4; X.translate(b.dx, b.dy);
  for (let i = 0; i < 4; i++) { const x = 140 + r() * 800; X.beginPath(); X.moveTo(x + (r() - .5) * 60, -10); X.lineTo(x + (r() - .5) * 60, H + 10); X.stroke(); }
  for (let i = 0; i < 4; i++) { const y = 200 + r() * 1500; X.beginPath(); X.moveTo(-10, y + (r() - .5) * 60); X.lineTo(W + 10, y + (r() - .5) * 60); X.stroke(); }
  X.restore();
}
function blinds(t) {
  X.save(); X.globalCompositeOperation = 'multiply'; X.translate(W / 2, H / 2); X.rotate(-.42); X.translate(-W, -H + Math.sin(t * .6) * 30);
  for (let i = 0; i < 16; i++) {
    const g = X.createLinearGradient(0, i * 260, 0, i * 260 + 260);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(120,112,100,.55)'); g.addColorStop(.62, 'rgba(120,112,100,.55)'); g.addColorStop(1, 'rgba(255,255,255,1)');
    X.fillStyle = g; X.globalAlpha = .38; X.fillRect(0, i * 260, W * 2, 260);
  }
  X.restore();
}
function grain(t) {
  X.save(); X.globalAlpha = .05; X.globalCompositeOperation = 'overlay';
  const s = Math.floor(t * 12) % 4; X.drawImage(A.tile, -s * 60, -s * 40, 1500, 2300); X.restore();
  // Vignette.
  const g = X.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.28)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function bg(im, t, seed) { const b = boil(t, seed, .3); X.drawImage(im, -10 + b.dx, -10 + b.dy, W + 20, H + 20); }

// ---------- scene 1: the paper page with the play button (0 - 2.5 s) ----------
const PB = { x: 560, y: 1000, r: 175 };
function paw(t) {
  // A paper-cut cat paw comes up from the bottom right and presses the button.
  if (t < 1.35) return;
  const k = t < 2.0 ? ease((t - 1.35) / .65) : t < 2.12 ? 1 : 1 - ease((t - 2.12) / .35) * .35;
  const press = t >= 1.95 && t < 2.15 ? 22 : 0;
  const sx = 1500, sy = 2300, ex = PB.x + 30, ey = PB.y + 20 + press;
  const x = sx + (ex - sx) * k, y = sy + (ey - sy) * k;
  const b = boil(t, 77, .6);
  X.save(); X.translate(x + b.dx, y + b.dy); X.rotate(-.62 + b.r);
  X.shadowColor = 'rgba(0,0,0,.35)'; X.shadowBlur = 26; X.shadowOffsetY = 14;
  // Arm: grey tabby paper strip, reaching in from off screen.
  X.save(); X.translate(0, 720);
  X.fillStyle = '#f7f3ea'; X.fill(tornPoly(250, 1300, 91, 8)); X.shadowColor = 'transparent';
  X.save(); X.clip(tornPoly(230, 1280, 92, 6));
  X.fillStyle = '#9a9a96'; X.fillRect(-200, -700, 400, 1400);
  X.fillStyle = '#4b4b48'; for (let i = 0; i < 9; i++) { X.save(); X.translate(0, -560 + i * 150); X.rotate(.18); X.fillRect(-150, 0, 300, 38); X.restore(); }
  texture(.55); X.restore(); X.restore();
  // The paw at the tip, toe beans down on the button.
  X.shadowColor = 'rgba(0,0,0,.35)'; X.shadowBlur = 26; X.shadowOffsetY = 14;
  X.fillStyle = '#f7f3ea'; X.beginPath(); X.ellipse(0, 0, 150, 125, 0, 0, Math.PI * 2); X.fill(); X.shadowColor = 'transparent';
  X.fillStyle = '#b8b8b4'; X.beginPath(); X.ellipse(0, 0, 138, 113, 0, 0, Math.PI * 2); X.fill();
  X.fillStyle = PINK; X.beginPath(); X.ellipse(0, 22, 58, 48, 0, 0, Math.PI * 2); X.fill();
  [[-78, -46], [-28, -80], [28, -80], [78, -46]].forEach(([px, py]) => { X.beginPath(); X.ellipse(px, py, 26, 30, 0, 0, Math.PI * 2); X.fill(); });
  X.restore();
}
function playButton(t) {
  const s = slam(t, 1.0); if (s == null) return;
  const b = boil(t, 55, .8);
  const squash = t >= 1.95 && t < 2.15 ? .9 : 1;
  X.save(); X.translate(PB.x + b.dx, PB.y + b.dy); X.rotate(-.05 + b.r); X.scale(s * squash, s * squash);
  X.shadowColor = 'rgba(0,0,0,.4)'; X.shadowBlur = 30; X.shadowOffsetY = 16;
  X.fillStyle = '#f7f3ea'; X.beginPath(); circlePath(PB.r + 14, 31); X.fill(); X.shadowColor = 'transparent';
  X.save(); X.beginPath(); circlePath(PB.r, 32); X.clip(); X.fillStyle = BLUE; X.fillRect(-300, -300, 600, 600); texture(.55); X.restore();
  X.fillStyle = '#f7f3ea'; X.beginPath(); X.moveTo(-50, -78); X.lineTo(84, 0); X.lineTo(-50, 78); X.closePath(); X.fill();
  X.restore();
}
function circlePath(r, seed) { const rr = rng(seed); let off = 0; for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2; off = off * .5 + (rr() - .5) * 9; const R = r + off; i ? X.lineTo(Math.cos(a) * R, Math.sin(a) * R) : X.moveTo(Math.cos(a) * R, Math.sin(a) * R); } X.closePath(); }
function scene1(t) {
  bg(A.paper, t, 1);
  grid(t, 3);
  // Big black block behind Meowie (like a torn magazine page).
  if (t >= .45) { const s = slam(t, .45), b = boil(t, 21, .5); X.save(); X.translate(330 + b.dx, 1480 + b.dy); X.rotate(.05 + b.r); X.scale(s, s); X.shadowColor = 'rgba(0,0,0,.3)'; X.shadowBlur = 20; X.fillStyle = '#f7f3ea'; X.fill(tornPoly(560, 700, 22, 12)); X.shadowColor = 'transparent'; X.save(); X.clip(tornPoly(540, 680, 23, 10)); X.fillStyle = INK; X.fillRect(-400, -400, 800, 800); texture(.5, 'screen'); X.restore(); X.restore(); }
  cutout(A.sit, { x: 330, y: 1540, scale: .78, rot: -4, t0: .6, seed: 31 }, t);
  label({ text: 'THIRSTY?', font: '190px Anton', size: 190, x: 520, y: 330, rot: -5, bg: INK, fg: '#f7f3ea', t0: .12, seed: 101 }, t);
  label({ text: 'MALAYSIA IS HOT', font: '84px Anton', size: 84, x: 600, y: 520, rot: 3, bg: BLUE, fg: '#f7f3ea', t0: .32, seed: 102 }, t);
  words({ text: 'one glass at a time,\nwith a cat in a\nshark hood.', font: '40px "Special Elite"', lh: 48, x: 640, y: 1290, rot: 2, t0: .7, type: 55, seed: 103 }, t);
  scribble(PB.x, PB.y, 230, 215, t, 1.15, .5, 7);
  playButton(t);
  label({ text: 'PRESS PLAY', font: '64px Anton', size: 64, x: PB.x + 40, y: PB.y - 270, rot: -7, bg: '#f7f3ea', fg: INK, t0: 1.25, seed: 104 }, t);
  paw(t);
  // Click lines when the button goes down.
  if (t >= 1.97 && t < 2.3) { X.save(); X.strokeStyle = INK; X.lineWidth = 9; X.lineCap = 'round'; for (let i = 0; i < 5; i++) { const a = -2.6 + i * .32, r0 = 250, r1 = 310; X.beginPath(); X.moveTo(PB.x + Math.cos(a) * r0, PB.y + Math.sin(a) * r0); X.lineTo(PB.x + Math.cos(a) * r1, PB.y + Math.sin(a) * r1); X.stroke(); } X.restore(); }
}

// ---------- scene 3: the app behind the rip (3.1 - 8.3 s) ----------
// Each beat: which recording, where in it, and its labels.
// Frames pulled out of the recordings (ffmpeg, 30 fps), one image per video frame.
const BEATS = [
  { t0: 2.35, t1: 4.75, dir: 'fr-drink/a', n: 75 },
  { t0: 4.75, t1: 5.95, dir: 'fr-drink/b', n: 39 },
  { t0: 5.95, t1: 7.15, dir: 'fr-party/a', n: 39 },
  { t0: 7.15, t1: 8.4, dir: 'fr-friends/a', n: 40 },
];
const frameCache = {};
async function videoFrame(beat, t) {
  const i = Math.max(1, Math.min(beat.n, 1 + Math.round((t - beat.t0) * FPS)));
  const src = `${beat.dir}${String(i).padStart(3, '0')}.jpg`;
  if (!frameCache[src]) { const im = new Image(); im.src = src; await im.decode(); frameCache[src] = im; }
  return frameCache[src];
}
const PH = { x: 540, y: 1010, w: 700, h: 1515, rot: -2.2 };
async function phone(t) {
  const beat = BEATS.find((b) => t >= b.t0 && t < b.t1) || BEATS[BEATS.length - 1];
  const v = await videoFrame(beat, t);
  const b = boil(t, 401, .4);
  X.save(); X.translate(PH.x + b.dx, PH.y + b.dy); X.rotate(PH.rot * Math.PI / 180 + b.r);
  X.shadowColor = 'rgba(0,20,60,.45)'; X.shadowBlur = 50; X.shadowOffsetY = 26;
  X.fillStyle = '#121212'; rr(-PH.w / 2 - 18, -PH.h / 2 - 18, PH.w + 36, PH.h + 36, 70); X.fill(); X.shadowColor = 'transparent';
  X.save(); rr(-PH.w / 2, -PH.h / 2, PH.w, PH.h, 54); X.clip(); X.drawImage(v, -PH.w / 2, -PH.h / 2, PH.w, PH.h);
  // A quick paper flash on each cut.
  const since = t - beat.t0; if (beat !== BEATS[0] && since < .1) { X.fillStyle = `rgba(247,243,234,${1 - since / .1})`; X.fillRect(-PH.w, -PH.h, PH.w * 2, PH.h * 2); }
  X.restore();
  X.restore();
  tape(PH.x - 300, PH.y - 760, -28, 201, t); tape(PH.x + 320, PH.y + 740, -24, 202, t);
}
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function tape(x, y, rot, seed, t) {
  const b = boil(t, seed, .4);
  X.save(); X.translate(x + b.dx, y + b.dy); X.rotate(rot * Math.PI / 180);
  X.globalAlpha = .82; X.fillStyle = '#f1e7c9'; X.fill(tornPoly(300, 82, seed, 4, 10));
  X.globalAlpha = .25; X.save(); X.clip(tornPoly(300, 82, seed, 4, 10)); texture(.6); X.restore();
  X.restore();
}
async function scene3(t) {
  bg(A.blue, t, 2);
  grid(t, 9, 'rgba(255,255,255,.45)');
  await phone(t);
  // Beat 1: tap, Meowie drinks.
  if (t < 4.75) {
    label({ text: 'TAP', font: '170px Anton', size: 170, x: 230, y: 330, rot: -8, bg: INK, fg: '#f7f3ea', t0: 3.2, seed: 301 }, t);
    label({ text: '+250 ML', font: '96px Anton', size: 96, x: 820, y: 1160, rot: 6, bg: YEL, fg: INK, t0: 3.5, seed: 302 }, t);
    label({ text: 'MEOWIE DRINKS IT', font: '70px Anton', size: 70, x: 520, y: 1680, rot: -3, bg: '#f7f3ea', fg: INK, t0: 4.05, seed: 303 }, t);
    scribble(820, 1160, 250, 120, t, 3.6, .35, 11, YEL, 9, 1.1);
  } else if (t < 5.95) {
    label({ text: '50%?', font: '150px Anton', size: 150, x: 250, y: 360, rot: -6, bg: '#f7f3ea', fg: BLUE, t0: 4.8, seed: 311 }, t);
    label({ text: 'HE SWIMS!', font: '130px Anton', size: 130, x: 600, y: 1650, rot: 4, bg: INK, fg: '#f7f3ea', t0: 5.05, seed: 312 }, t);
    arrow(260, 520, 420, 780, t, 5.3, YEL);
    cutout(A.swim, { x: 860, y: 330, scale: .55, rot: 8, t0: 5.2, seed: 313 }, t);
  } else if (t < 7.15) {
    label({ text: 'HIT 100%', font: '150px Anton', size: 150, x: 520, y: 300, rot: -5, bg: YEL, fg: INK, t0: 6.0, seed: 321 }, t);
    label({ text: 'PARTY TIME', font: '110px Anton', size: 110, x: 560, y: 1690, rot: 3, bg: INK, fg: YEL, t0: 6.3, seed: 322 }, t);
    scribble(540, 300, 380, 120, t, 6.15, .35, 13, '#f7f3ea', 9, 1.1);
  } else {
    label({ text: 'RACE YOUR', font: '120px Anton', size: 120, x: 420, y: 280, rot: -6, bg: '#f7f3ea', fg: INK, t0: 7.2, seed: 331 }, t);
    label({ text: 'FRIENDS', font: '150px Anton', size: 150, x: 640, y: 430, rot: 3, bg: INK, fg: '#f7f3ea', t0: 7.4, seed: 332 }, t);
    label({ text: 'WEEKLY LEAGUE', font: '70px Anton', size: 70, x: 560, y: 1700, rot: -3, bg: YEL, fg: INK, t0: 7.7, seed: 333 }, t);
  }
}

// ---------- the rip (2.35 - 3.15 s) ----------
const tear = (() => { const r = rng(5), pts = []; let x = 560, off = 0; for (let y = -40; y <= H + 40; y += 26) { off = off * .6 + (r() - .5) * 46; pts.push([x + off + Math.sin(y * .006) * 30, y]); } return pts; })();
const S1 = document.createElement('canvas'); S1.width = W; S1.height = H;
function halfPath(left) {
