# Wakes Minum Air's reminder job every half hour, so Meowie's pace reminders reach phones even
# when the app is closed. (Vercel's free plan only allows a daily schedule.) The endpoint itself
# decides who is due and does a full pass at most once every 10 minutes.
name: Minum Air reminders
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the reminder check
        run: curl -fsS --max-time 60 https://minum-air.vercel.app/api/push-cron
