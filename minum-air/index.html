<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minum Air</title>
<meta name="description" content="One-tap water habit that adjusts your daily goal to today's heat in your Malaysian city.">
<meta name="theme-color" content="#0b7fd1">
<link rel="manifest" href="/minum-air/manifest.webmanifest">
<link rel="icon" href="/minum-air/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/minum-air/icon.svg">
<style>
  :root {
    --bg: #f3f9ff;
    --card: #ffffff;
    --ink: #0d2236;
    --muted: #5b7186;
    --line: #dbe8f4;
    --water: #1593e6;
    --water-deep: #0b7fd1;
    --water-soft: #cfe8fb;
    --hot: #e2572b;
    --ok: #13915f;
    --on-water: #ffffff;
    --shadow: 0 6px 24px rgba(11, 60, 110, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #081521; --card: #0f2131; --ink: #e8f2fb; --muted: #93a9bd; --line: #1c3347;
      --water: #3aa8f0; --water-deep: #62bdf6; --water-soft: #12324a; --hot: #ff8a5c; --ok: #3ccf8e; --on-water: #04213a;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #081521; --card: #0f2131; --ink: #e8f2fb; --muted: #93a9bd; --line: #1c3347;
    --water: #3aa8f0; --water-deep: #62bdf6; --water-soft: #12324a; --hot: #ff8a5c; --ok: #3ccf8e; --on-water: #04213a;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 440px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--water-deep); }
  .icon-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .weather { display: flex; align-items: center; gap: 12px; }
  .weather .temp { font-size: 30px; font-weight: 700; color: var(--hot); min-width: 74px; }
  .weather .meta { font-size: 14px; color: var(--muted); }
  .weather .meta b { color: var(--ink); font-weight: 600; }

  .glass-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px; }
  .glass {
    position: relative; width: 150px; height: 210px;
    border: 4px solid var(--water-deep); border-top-width: 0;
    border-radius: 6px 6px 34px 34px; overflow: hidden; background: transparent;
  }
  .fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: linear-gradient(180deg, var(--water) 0%, var(--water-deep) 100%);
    transition: height .6s cubic-bezier(.2, .8, .2, 1);
  }
  .fill::before {
    content: ""; position: absolute; top: -8px; left: -10%; width: 120%; height: 16px;
    background: var(--water); border-radius: 50%; opacity: .7;
  }
  .glass.done { border-color: var(--ok); }
  .amount { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .amount small { font-size: 16px; font-weight: 500; color: var(--muted); }
  .msg { text-align: center; color: var(--muted); min-height: 2.9em; margin: 0 8px; }

  .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 6px; }
  .drink {
    border: 0; border-radius: 18px; padding: 18px; font: inherit; font-size: 19px; font-weight: 700;
    background: var(--water-deep); color: var(--on-water); cursor: pointer; touch-action: manipulation;
    transition: transform .08s ease;
  }
  .drink:active { transform: scale(.97); }
  .undo { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 18px; padding: 0 18px; font: inherit; cursor: pointer; }
  .undo:disabled { opacity: .4; cursor: default; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .stat .v { font-size: 24px; font-weight: 800; }
  .stat .l { font-size: 13px; color: var(--muted); }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px; }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar .b { width: 100%; max-width: 30px; border-radius: 8px 8px 4px 4px; background: var(--water-soft); position: relative; overflow: hidden; height: 80px; }
  .bar .b i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--water); border-radius: 4px; }
  .bar .b.hit i { background: var(--ok); }
  .bar span { font-size: 12px; color: var(--muted); }
  .bar.today span { color: var(--ink); font-weight: 700; }
  h2 { font-size: 15px; margin: 0 0 12px; }

  dialog { border: 1px solid var(--line); border-radius: 20px; padding: 0; background: var(--card); color: var(--ink); width: min(92vw, 400px); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(5, 20, 35, .45); }
  dialog form { padding: 18px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  select { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .row { display: flex; gap: 10px; justify-content: flex-end; }
  .primary { border: 0; background: var(--water-deep); color: var(--on-water); border-radius: 12px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .foot a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .fill, .drink { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>💧 Minum <span>Air</span></h1>
    <button class="icon-btn" id="openSettings" type="button">⚙️ Tetapan</button>
  </header>

  <section class="card weather" aria-live="polite">
    <div class="temp" id="temp">--°</div>
    <div class="meta">
      <div><b id="cityName">Kuala Lumpur</b> · terasa macam (feels like)</div>
      <div id="weatherNote">Memuatkan cuaca…</div>
    </div>
  </section>

  <section class="card">
    <div class="glass-wrap">
      <div class="glass" id="glass" role="img" aria-label="Progress"><div class="fill" id="fill"></div></div>
      <div class="amount"><span id="drunk">0</span> <small>/ <span id="goal">2000</span> ml</small></div>
      <p class="msg" id="msg"></p>
    </div>
    <div class="actions">
      <button class="drink" id="drink" type="button">+ 1 gelas (<span id="glassLabel">250</span> ml)</button>
      <button class="undo" id="undo" type="button" aria-label="Undo last glass">↶</button>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><div class="v" id="streak">0 🔥</div><div class="l">Streak (hari capai target)</div></div>
    <div class="stat"><div class="v" id="glassesLeft">8</div><div class="l">Gelas lagi hari ini</div></div>
  </section>

  <section class="card">
    <h2>7 hari lepas</h2>
    <div class="week" id="week"></div>
  </section>

  <p class="foot">Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Data stays on your phone.</p>
</main>

<dialog id="settings">
  <form method="dialog">
    <h2>Tetapan</h2>
    <label>Bandar (city)
      <select id="citySelect"></select>
    </label>
    <label>Saiz gelas (glass size)
      <select id="glassSelect">
        <option value="200">200 ml · cawan kecil</option>
        <option value="250">250 ml · gelas biasa</option>
        <option value="350">350 ml · mug</option>
        <option value="500">500 ml · botol</option>
      </select>
    </label>
    <div class="row">
      <button class="icon-btn" value="cancel" type="submit">Batal</button>
      <button class="primary" value="save" type="submit">Simpan</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  // Malaysian cities with coordinates for the Open-Meteo forecast.
  const CITIES = [
    ['Kuala Lumpur', 3.139, 101.687], ['Putrajaya', 2.926, 101.696], ['Shah Alam', 3.073, 101.519],
    ['Petaling Jaya', 3.107, 101.607], ['George Town', 5.414, 100.329], ['Ipoh', 4.597, 101.090],
    ['Alor Setar', 6.121, 100.367], ['Kangar', 6.441, 100.198], ['Kota Bharu', 6.125, 102.238],
    ['Kuala Terengganu', 5.329, 103.137], ['Kuantan', 3.817, 103.326], ['Seremban', 2.726, 101.938],
    ['Melaka', 2.189, 102.250], ['Johor Bahru', 1.493, 103.741], ['Kota Kinabalu', 5.980, 116.073],
    ['Sandakan', 5.840, 118.117], ['Tawau', 4.245, 117.891], ['Kuching', 1.553, 110.359],
    ['Miri', 4.399, 113.991], ['Sibu', 2.288, 111.831], ['Labuan', 5.280, 115.242],
  ];
  const BASE_GOAL = 2000;          // ml on a normal day
  const HEAT_START = 32;           // feels-like °C where extra water kicks in
  const EXTRA_PER_2C = 250;        // +1 glass for every 2 °C above HEAT_START
  const MAX_EXTRA = 1250;
  const STORE_KEY = 'minum-air:v1';

  const $ = (id) => document.getElementById(id);

  // Storage can throw (private mode, blocked site data); the app still works for the session.
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }

  const state = Object.assign({ city: 'Kuala Lumpur', glassMl: 250, days: {}, weather: null }, load());

  function dayKey(d = new Date()) {
    // Local date in Malaysia time regardless of device timezone.
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kuala_Lumpur' }).format(d);
  }
  function today() {
    const k = dayKey();
    if (!state.days[k]) state.days[k] = { ml: 0, goal: currentGoal(), log: [] };
    return state.days[k];
  }
  function goalFor(feelsMax) {
    if (feelsMax == null || feelsMax < HEAT_START) return BASE_GOAL;
    const extra = (Math.floor((feelsMax - HEAT_START) / 2) + 1) * EXTRA_PER_2C;
    return BASE_GOAL + Math.min(MAX_EXTRA, extra);
  }
  function currentGoal() {
    const w = state.weather;
    return w && w.day === dayKey() && w.city === state.city ? goalFor(w.feelsMax) : BASE_GOAL;
  }

  function message(d) {
    const pct = d.ml / d.goal;
    const hot = state.weather && state.weather.feelsMax >= HEAT_START;
    if (pct >= 1) return 'Terbaik! Target hari ni dah capai 🎉 Badan you terima kasih.';
    if (pct >= .75) return 'Sikit lagi je! Satu dua gelas lagi, can one.';
    if (pct >= .5) return 'Separuh jalan dah. Jangan tukar jadi teh ais pula 😆';
    if (pct > 0) return hot ? 'Panas ni bos, jangan lupa minum!' : 'Good start. Teruskan!';
    return hot ? `Hari ni panas gila. Target naik ke ${d.goal} ml.` : 'Mula hari dengan segelas air 💧';
  }

  function streak() {
    let n = 0;
    const d = new Date();
    // Today counts only once it is hit; an unfinished today doesn't break the streak.
    const t = state.days[dayKey(d)];
    if (t && t.ml >= t.goal) n++;
    for (let i = 1; i < 3650; i++) {
      d.setTime(Date.now() - i * 864e5);
      const rec = state.days[dayKey(d)];
      if (rec && rec.ml >= rec.goal) n++; else break;
    }
    return n;
  }

  function renderWeek() {
    const names = ['Ahd', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab'];
    const wk = $('week');
    wk.textContent = '';
    for (let i = 6; i >= 0; i--) {
      const date = new Date(Date.now() - i * 864e5);
      const k = dayKey(date);
      const rec = state.days[k];
      const pct = rec ? Math.min(1, rec.ml / rec.goal) : 0;
      const dow = new Date(k + 'T12:00:00').getDay();
      const bar = document.createElement('div');
      bar.className = 'bar' + (i === 0 ? ' today' : '');
      bar.innerHTML = `<div class="b${pct >= 1 ? ' hit' : ''}"><i style="height:${Math.round(pct * 100)}%"></i></div><span>${names[dow]}</span>`;
      bar.title = rec ? `${k}: ${rec.ml}/${rec.goal} ml` : k;
      wk.appendChild(bar);
    }
  }

  function render() {
    const d = today();
    const pct = Math.min(1, d.ml / d.goal);
    $('fill').style.height = (pct * 100) + '%';
    $('glass').classList.toggle('done', pct >= 1);
    $('glass').setAttribute('aria-label', `${Math.round(pct * 100)}% of today's goal`);
    $('drunk').textContent = d.ml;
    $('goal').textContent = d.goal;
    $('msg').textContent = message(d);
    $('glassLabel').textContent = state.glassMl;
    $('undo').disabled = !d.log.length;
    $('streak').textContent = streak() + ' 🔥';
    $('glassesLeft').textContent = Math.max(0, Math.ceil((d.goal - d.ml) / state.glassMl));
    $('cityName').textContent = state.city;
    const w = state.weather;
    if (w && w.city === state.city && w.day === dayKey()) {
      $('temp').textContent = Math.round(w.feelsMax) + '°';
      $('weatherNote').textContent = w.feelsMax >= HEAT_START
        ? `Panas! Target naik +${d.goal - BASE_GOAL} ml`
        : 'Cuaca okay, target biasa';
    }
    renderWeek();
  }

  async function fetchWeather() {
    const city = CITIES.find((c) => c[0] === state.city) || CITIES[0];
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + city[1] + '&longitude=' + city[2] +
      '&daily=apparent_temperature_max&timezone=Asia%2FKuala_Lumpur&forecast_days=1';
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const feelsMax = data.daily.apparent_temperature_max[0];
      state.weather = { city: state.city, day: dayKey(), feelsMax };
      // Only raise today's goal; never lower it below what was already set.
      const d = today();
      d.goal = Math.max(d.goal, goalFor(feelsMax));
      save();
      render();
    } catch {
      const w = state.weather;
      if (!(w && w.city === state.city && w.day === dayKey())) {
        $('temp').textContent = '--°';
        $('weatherNote').textContent = 'Tak dapat cuaca (offline?). Target biasa 2000 ml.';
      }
    }
  }

  $('drink').addEventListener('click', () => {
    const d = today();
    d.ml += state.glassMl;
    d.log.push(state.glassMl);
    if (navigator.vibrate) navigator.vibrate(15);
    save();
    render();
  });
  $('undo').addEventListener('click', () => {
    const d = today();
    if (!d.log.length) return;
    d.ml = Math.max(0, d.ml - d.log.pop());
    save();
    render();
  });

  const citySelect = $('citySelect');
  for (const [name] of CITIES) citySelect.add(new Option(name, name));
  $('openSettings').addEventListener('click', () => {
    citySelect.value = state.city;
    $('glassSelect').value = String(state.glassMl);
    $('settings').showModal();
  });
  $('settings').addEventListener('close', () => {
    if ($('settings').returnValue !== 'save') return;
    const cityChanged = citySelect.value !== state.city;
    state.city = citySelect.value;
    state.glassMl = Number($('glassSelect').value);
    if (cityChanged) {
      // Recompute today's goal from the new city's weather.
      today().goal = BASE_GOAL;
      state.weather = null;
      $('temp').textContent = '--°';
      $('weatherNote').textContent = 'Memuatkan cuaca…';
    }
    save();
    render();
    if (cityChanged) fetchWeather();
  });

  // Roll over to a new day if the app stays open past midnight.
  let lastDay = dayKey();
  setInterval(() => {
    if (dayKey() !== lastDay) { lastDay = dayKey(); render(); fetchWeather(); }
  }, 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  render();
  fetchWeather();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/minum-air/sw.js', { scope: '/minum-air' })
      .catch(() => navigator.serviceWorker.register('/minum-air/sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
