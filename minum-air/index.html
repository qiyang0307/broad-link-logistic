<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minum Air</title>
<meta name="description" content="Minum Air: a Malaysian water habit app with Bos Meow, the cool cat who fills up as you drink. Goal adjusts to today's heat in your city.">
<meta name="theme-color" content="#0a84d6">
<link rel="manifest" href="/minum-air/manifest.webmanifest">
<link rel="icon" href="/minum-air/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/minum-air/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="/minum-air/styles.css">
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabbar" id="tabbar" hidden>
  <button type="button" data-tab="home" class="on"><span>💧</span>Hari Ini</button>
  <button type="button" data-tab="history"><span>📊</span>Sejarah</button>
  <button type="button" data-tab="profile"><span>😺</span>Profil</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Tambah minuman"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas class="fx" id="fx"></canvas>

<script src="/minum-air/cat.js"></script>
<script src="/minum-air/app.js"></script>
</body>
</html>
